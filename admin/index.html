<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVA Monitor — Admin Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2300b4d8' width='100' height='100'/><text x='50' y='70' font-size='70' font-weight='bold' fill='%23fff' text-anchor='middle'>E</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tables.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🏭</div>
        <div>
          <h1>EVA Monitor</h1>
          <p>Admin Panel</p>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn-logout" id="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="user-menu">
          <button class="btn-icon" id="notifications-btn" title="Notifications">
            🔔
            <span class="badge">0</span>
          </button>
          <button class="btn-icon" id="profile-btn" title="Profile">👤</button>
        </div>
      </div>

      <div class="page-container">
        <div id="page-content"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
