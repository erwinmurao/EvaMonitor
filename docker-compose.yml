services:
  eva-monitor:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: eva-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
      - backups:/app/backups
      - ./server/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  backups:
