services:
  eva-monitor:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: eva-monitor
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - db-data:/app/data
      - backups:/app/backups
      - ./server/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: eva-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - eva-monitor

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
